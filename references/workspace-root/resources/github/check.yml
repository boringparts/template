name: Check

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Full Check
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Set up pnpm and Node.js
        uses: pnpm/setup@731dfb6463bbd11c11fd0ee11fe00ed0e36d48a1 # v3.2.0
        with:
          node-version-file: false
          install: false
          cache: true
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run Light Check
        run: node --conditions=source scripts/task-gates.ts check
      - name: Run Heavy Check
        id: run-heavy-check
        run: node --conditions=source scripts/task-gates.ts check:heavy
      - name: Upload Check diagnostics
        id: upload-diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: check-diagnostics
          path: |
            **/test-results/**
            **/playwright-report/**
            **/.vitest/attachments/**
            !**/node_modules/**
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7
