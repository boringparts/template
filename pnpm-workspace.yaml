  "@types/web-bluetooth": ^0.0.22
  "@vikejs/hono": ^0.4.1
  "@vitejs/plugin-vue": ^6.0.11
  "@vitest/browser-playwright": ^5.1.1
  "@vue/devtools-api": ^8.1.5
  "@vue/tsconfig": ^0.9.1
  drizzle-kit: 1.0.0-rc.6
  drizzle-orm: 1.0.0-rc.6
  esbuild: ^0.27.0
  hono: ^4.13.19
  oxfmt: ^0.79.0
  oxlint: 1.94.0
  pinia: ^4.0.2
  playwright: 1.64.0
  smol-toml: ^1.8.0
