name: Check

on:
  pull_request:
  push:
    branches:
      - main
      - "ci/**"
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  light-check:
    name: Light Check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Set up pnpm and Node.js
        uses: pnpm/setup@731dfb6463bbd11c11fd0ee11fe00ed0e36d48a1 # v3.2.0
        with:
          node-version-file: false
          install: false
          cache: true
      - name: Ensure Rust toolchain and ShellCheck
        run: |
          rustup show active-toolchain
          cargo fmt --version
          cargo clippy --version
          command -v shellcheck >/dev/null || (sudo apt-get update && sudo apt-get install -y --no-install-recommends shellcheck)
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run Light Check
        run: node --conditions=source scripts/task-gates.ts check

  repo-devcontainer:
    name: Repository Devcontainer Smoke
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Set up pnpm and Node.js
        uses: pnpm/setup@731dfb6463bbd11c11fd0ee11fe00ed0e36d48a1 # v3.2.0
        with:
          node-version-file: false
          install: false
          cache: true
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run repository devcontainer smoke check
        run: node --conditions=source packages/template/scripts/verify-containers.ts --scenario repo-devcontainer

  container-matrix:
    name: Container Verify (${{ matrix.scenario }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        scenario:
          - ts-lib
          - node-lib
          - ts-cli
          - rust-bin
          - vue-app
          - vue-hono-app
          - vike-app
          - vue-hono-fullstack
          - polyglot-cli
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Set up pnpm and Node.js
        uses: pnpm/setup@731dfb6463bbd11c11fd0ee11fe00ed0e36d48a1 # v3.2.0
        with:
          node-version-file: false
          install: false
          cache: true
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build CLI distribution
        run: pnpm --filter @boringparts/template run build
      - name: Verify scenario in devcontainer
        run: node --conditions=source packages/template/scripts/verify-containers.ts --scenario ${{ matrix.scenario }} --diagnostics-dir .ci-diagnostics/${{ matrix.scenario }}
      - name: Upload container diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: container-diagnostics-${{ matrix.scenario }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: .ci-diagnostics/${{ matrix.scenario }}
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7
