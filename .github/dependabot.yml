version: 2

updates:
  - package-ecosystem: devcontainers
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      drizzle:
        patterns:
          - drizzle-*
          - drizzle-orm
    ignore:
      - dependency-name: "@types/node"
        update-types:
          - version-update:semver-major
      - dependency-name: pnpm
        update-types:
          - version-update:semver-major
          - version-update:semver-minor
          - version-update:semver-patch
  - package-ecosystem: rust-toolchain
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: cargo
    directory: /references/rust-bin
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directories:
      - /
      - /references/workspace-root/resources/github
      - /references/npm-publication/resources
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directories:
      - /.devcontainer
      - /references/workspace-root/resources/environment
      - /references/vike-deployment/resources/deployment
    schedule:
      interval: weekly
